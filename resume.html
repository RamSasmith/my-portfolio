<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bestha Ramsasmith | Resume PDF</title>
  <link rel="icon" href="https://img.icons8.com/neon/96/code-fork.png" type="image/png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #050714;
      color: #e0e6ed;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .pdf-header {
      background: rgba(10, 12, 30, 0.9);
      backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(0, 240, 255, 0.2);
      padding: 15px 0;
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .pdf-container {
      height: calc(100vh - 80px);
      width: 100%;
      border: none;
    }
  </style>
</head>

<body>
  <header class="pdf-header">
    <div class="container d-flex justify-content-between align-items-center">
      <div class="d-flex align-items-center gap-3">
        <a href="index.html" class="btn btn-cyber btn-cyber-outline btn-sm">
          <i class="bi bi-arrow-left"></i> Back to Portfolio
        </a>
        <h1 class="h5 mb-0 text-cyan font-heading">Bestha Ramsasmith - Resume</h1>
      </div>
      <div class="d-flex gap-2">
        <a href="resume.pdf" download="Bestha_Ramsasmith_Resume.pdf" class="btn btn-cyber btn-cyber-primary btn-sm">
          <i class="bi bi-download"></i> Download PDF
        </a>
        <a href="resume.pdf" target="_blank" class="btn btn-cyber btn-cyber-purple btn-sm">
          <i class="bi bi-box-arrow-up-right"></i> Open PDF Directly
        </a>
      </div>
    </div>
  </header>

  <main>
    <object data="resume.pdf" type="application/pdf" class="pdf-container">
      <iframe src="resume.pdf" class="pdf-container">
        <div class="container text-center py-5">
          <h3 class="text-cyan">Resume PDF File</h3>
          <p class="text-muted">You can view or download the PDF file directly below:</p>
          <a href="resume.pdf" target="_blank" class="btn btn-cyber btn-cyber-primary mt-3">
            <i class="bi bi-file-earmark-pdf-fill me-2"></i> Open Resume PDF
          </a>
        </div>
      </iframe>
    </object>
  </main>
</body>

</html>
